# ===================================================
# STARTUP TEAM CONNECT - SPRING BOOT CONFIGURATION
# ===================================================

server.port=8080

# Database Configuration (H2 File-based DB in MySQL mode for zero-config execution)
spring.datasource.url=jdbc:h2:file:./data/startup_team_connect_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Database Configuration (Optional - uncomment to switch to local MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/startup_team_connect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=Sruthi@2006
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open In View
spring.jpa.open-in-view=false
